name: Visual proof comment

# Posts a PR's screenshots as a single "Visual proof" comment.
#
# Agents (and humans) upload screenshots with `npm run pr:screenshots -- a.png b.png`,
# which pushes them to the never-merged `pr-assets` branch under a folder named
# after the PR's head branch. This workflow renders that folder into one
# comment (the newest upload inline, earlier ones collapsed) and keeps it
# updated. The comment is written with this workflow's GITHUB_TOKEN, so the
# image Markdown never goes through an agent's GitHub tool, which rewrites
# image links in the text it posts. Nothing is committed to the PR branch, so
# screenshots never enter main's history.
#
# Triggers: opening/reopening a PR and every push to it pick up whatever was
# uploaded before. To refresh after uploading with no further push, run it by
# hand: `workflow_dispatch` with the PR number (GitHub MCP `actions_run_trigger`,
# method run_workflow, workflow_id pr-visual-proof.yml, ref main, inputs {pr: "N"}).
# Rendering logic lives in scripts/lib/visualProof.mjs (unit-tested).

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to refresh
        required: true

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-visual-proof-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  comment:
    # Fork PRs get a read-only token and can't upload to pr-assets anyway.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/lib/visualProof.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { COMMENT_MARKER, folderForBranch, groupBatches, renderComment } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/visualProof.mjs`).href
            );
            const { owner, repo } = context.repo;
            const issue_number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed(`Not a PR number: ${process.env.PR_NUMBER}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            const folder = folderForBranch(pr.head.ref);

            let sha;
            try {
              ({ data: { object: { sha } } } = await github.rest.git.getRef({ owner, repo, ref: 'heads/pr-assets' }));
            } catch (err) {
              if (err.status === 404) { core.info('No pr-assets branch yet.'); return; }
              throw err;
            }
            const { data: tree } = await github.rest.git.getTree({ owner, repo, tree_sha: sha, recursive: 'true' });
            if (tree.truncated) core.warning('pr-assets tree listing was truncated; some screenshots may be missing.');
            const batches = groupBatches(tree.tree.filter((e) => e.type === 'blob').map((e) => e.path), folder);
            if (batches.length === 0) { core.info(`No screenshots under pr-assets/${folder}/.`); return; }
            // Pin links to the last commit that touched this PR's folder, not the
            // branch tip, so other PRs' uploads don't churn this comment.
            const { data: [folderCommit] } = await github.rest.repos.listCommits({ owner, repo, sha, path: folder, per_page: 1 });
            if (folderCommit) sha = folderCommit.sha;

            const latest = batches[batches.length - 1];
            let proofMarkdown = null;
            if (latest.proofPath) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: latest.proofPath, ref: sha });
              proofMarkdown = Buffer.from(data.content, 'base64').toString('utf8');
            }
            const body = renderComment({ repoSlug: `${owner}/${repo}`, sha, batches, proofMarkdown });

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(COMMENT_MARKER));
            if (!existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
              core.info(`Posted visual proof for ${folder} (${latest.images.length} image(s)).`);
            } else if (existing.body !== body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              core.info(`Updated visual proof for ${folder} (${latest.images.length} image(s)).`);
            } else {
              core.info('Visual proof comment already up to date.');
            }
