name: Visual proof comment

# Posts a PR's screenshots as one "Visual proof" comment and checks that GitHub
# renders every image.
#
# `npm run pr:screenshots -- a.png b.png` uploads screenshots to the
# never-merged `pr-assets` branch (one folder per PR branch, one sub-folder per
# upload). This workflow renders the newest upload into a comment written with
# its own GITHUB_TOKEN. The posting has to happen here, not in an agent session:
# cloud sessions' GitHub proxy defangs image links in text a session posts
# (wraps the URL in backticks), which is what broke visual proof in older PRs.
#
# Runs when a PR is opened, reopened or pushed to (picking up whatever was
# uploaded before), and on demand: workflow_dispatch with the PR number and,
# optionally, which upload to show. pr:screenshots dispatches it itself where
# `gh` can; from a cloud session use the GitHub MCP tool `actions_run_trigger`
# (method run_workflow, workflow_id pr-visual-proof.yml, ref main).
# Rendering logic: scripts/lib/visualProof.mjs (unit-tested).

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number
        required: true
      upload:
        description: Upload to show (its YYYYMMDD-HHMMSS stamp); default the newest
        required: false

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-visual-proof-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  comment:
    # Fork PRs get a read-only token and can't upload to pr-assets anyway.
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/lib/visualProof.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          UPLOAD: ${{ inputs.upload }}
        with:
          script: |
            const { pathToFileURL } = require('node:url');
            const { COMMENT_MARKER, folderForBranch, groupBatches, missingImages, renderComment } = await import(
              pathToFileURL(`${process.env.GITHUB_WORKSPACE}/scripts/lib/visualProof.mjs`).href
            );
            const { owner, repo } = context.repo;
            const slug = `${owner}/${repo}`;
            const issue_number = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(issue_number) || issue_number <= 0) {
              core.setFailed(`Not a PR number: ${process.env.PR_NUMBER}`);
              return;
            }
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: issue_number });
            const folder = folderForBranch(pr.head.ref);

            let tip;
            try {
              ({ data: { object: { sha: tip } } } = await github.rest.git.getRef({ owner, repo, ref: 'heads/pr-assets' }));
            } catch (err) {
              if (err.status === 404) { core.info('No pr-assets branch yet.'); return; }
              throw err;
            }
            const { data: tree } = await github.rest.git.getTree({ owner, repo, tree_sha: tip, recursive: 'true' });
            if (tree.truncated) core.warning('pr-assets tree listing was truncated; some screenshots may be missing.');
            let batches = groupBatches(tree.tree.filter((e) => e.type === 'blob').map((e) => e.path), folder);
            const upload = process.env.UPLOAD;
            if (upload) {
              batches = batches.filter((b) => b.stamp <= upload);
              if (batches.at(-1)?.stamp !== upload) { core.setFailed(`No upload ${upload} under pr-assets/${folder}/.`); return; }
            }
            if (batches.length === 0) { core.info(`No screenshots under pr-assets/${folder}/.`); return; }
            const latest = batches.at(-1);

            // Pin links to the last commit that touched this folder, so other
            // PRs' uploads don't churn this comment.
            const { data: [folderCommit] } = await github.rest.repos.listCommits({ owner, repo, sha: tip, path: folder, per_page: 1 });
            const sha = folderCommit?.sha ?? tip;
            let proofMarkdown = null;
            if (latest.proofPath) {
              const { data } = await github.rest.repos.getContent({ owner, repo, path: latest.proofPath, ref: sha });
              proofMarkdown = Buffer.from(data.content, 'base64').toString('utf8');
            }
            const body = renderComment({ repoSlug: slug, sha, batches, proofMarkdown });

            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
            const existing = comments.find((c) => c.user?.type === 'Bot' && c.body?.startsWith(COMMENT_MARKER));
            let commentId = existing?.id;
            if (!existing) {
              ({ data: { id: commentId } } = await github.rest.issues.createComment({ owner, repo, issue_number, body }));
              core.info(`Posted visual proof for ${folder}/${latest.stamp}.`);
            } else if (existing.body !== body) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: commentId, body });
              core.info(`Updated visual proof for ${folder}/${latest.stamp}.`);
            } else {
              core.info('Visual proof comment already up to date.');
            }

            const { data: rendered } = await github.rest.issues.getComment({ owner, repo, comment_id: commentId, mediaType: { format: 'html' } });
            const missing = missingImages(rendered.body_html ?? '', slug, sha, latest.images);
            if (missing.length > 0) {
              core.setFailed(`GitHub isn't rendering ${missing.map((m) => m.name).join(', ')} as images; check the --layout file's image references.`);
            } else {
              core.info(`Verified: GitHub renders all ${latest.images.length} image(s).`);
            }
