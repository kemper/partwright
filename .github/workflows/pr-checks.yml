name: PR checks

# Pre-merge feedback on PRs into main: type-check, production build, unit
# tests, and the full e2e suite. Build + unit and the e2e shards run IN
# PARALLEL (no `needs:` gate) — gating e2e on build-unit added ~2 min of
# serial latency to every run, and shard minutes are free on this public repo.
# A broken build still fails the build-unit job, and the e2e shards run against
# the Vite dev server, so they don't depend on the production build.
#
# Every PR push runs the full suite — build + unit, then the e2e shards —
# regardless of draft state, so draft PRs get the same signal as ready ones.
# Drafts already fire `opened`/`synchronize` like any PR, and there's no
# draft gate on the e2e job. Marking a PR ready for review is purely a
# review-readiness signal — it does not re-run CI (the draft pushes did).
#
# The e2e suite is CPU-bound (each test boots WASM in its own browser page),
# so it runs SERIALLY within a runner (playwright.config.ts pins workers: 1)
# and is parallelized across 8 runners by TIME-BALANCED sharding: E2E_SHARD=i/N
# makes playwright.config.ts run only the spec files scripts/lib/e2eShard.mjs
# assigns to shard i, weighted by tests/e2e-timings.json. (Playwright's own
# --shard balances by test count, which left shards at 8.5 / 11.3 / 17.1 min.)
# Keep the matrix below and staging-gate.yml's in sync.
#
# Doc-only changes (markdown, release config, license) skip CI entirely via
# paths-ignore — they can't affect build/test/runtime behavior.
#
# The staging-gate workflow re-runs the full suite after merge as the
# staging promotion gate (and as a safety net for any direct pushes).

on:
  pull_request:
    branches: [main]
    # Drafts trigger opened/synchronize like any PR, so they get the full
    # suite too. No ready_for_review: flipping a green draft to ready would
    # only re-run the same commit's checks and waste shard minutes.
    types: [opened, synchronize, reopened]
    paths-ignore:
      - '**/*.md'
      - '.github/release.yml'
      - 'LICENSE'

# A new push to the PR branch supersedes an in-flight run for the same PR.
concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (type-check + vite build)
        run: npm run build

      - name: Unit tests
        run: npm run test:unit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache the ~150MB Chromium build keyed on the lockfile (which pins the
      # playwright version). Cache hits skip the download; system deps still
      # install fresh below.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright browsers (cache miss)
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
      - name: Install Playwright system deps
        run: npx playwright install-deps chromium
      - name: E2E tests (shard ${{ matrix.shard }}/8)
        env:
          E2E_SHARD: ${{ matrix.shard }}/8
        run: npx playwright test --pass-with-no-tests
