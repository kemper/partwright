<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Skinned figure prototype</title>
  <style>
    html, body { margin: 0; height: 100%; background: #1d2025; color: #e7e9ee; font: 13px/1.4 system-ui, sans-serif; overflow: hidden; }
    #view { position: fixed; inset: 0; }
    #ui { position: fixed; left: 12px; top: 12px; display: flex; flex-direction: column; gap: 8px; max-width: min(360px, calc(100vw - 24px)); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    button { background: #2c313a; color: inherit; border: 1px solid #444b57; border-radius: 6px; padding: 6px 10px; cursor: pointer; font: inherit; }
    button.on { background: #3d6fd6; border-color: #3d6fd6; }
    input[type=range] { flex: 1; }
    #status { color: #9aa3b2; }
    #pose { width: 100%; height: 130px; background: #111317; color: #b9e3b0; border: 1px solid #333; border-radius: 6px; font: 11px/1.3 ui-monospace, monospace; display: none; }
  </style>
</head>
<body>
  <div id="view"></div>
  <div id="ui">
    <div class="row" id="anims"></div>
    <div class="row">
      <button id="play">Pause</button>
      <input id="scrub" type="range" min="0" max="1" step="0.001" value="0" />
    </div>
    <div class="row">
      <label><input id="bones" type="checkbox" /> skeleton</label>
      <label><input id="weights" type="checkbox" /> weights</label>
      <button id="snap">Pose for print</button>
    </div>
    <textarea id="pose" readonly></textarea>
    <div id="status">loading…</div>
  </div>
  <script type="module" src="./main.mjs"></script>
</body>
</html>
